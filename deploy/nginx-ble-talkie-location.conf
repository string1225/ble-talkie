# Bootstrap reservation for the four-person talkie service.
# Include inside the existing home.sunny-string.cn HTTPS server block.
# Replace these responses with a prefix-preserving upstream when the relay is ready.

location = /ble-talkie {
    return 308 /ble-talkie/;
}

location = /ble-talkie/ {
    default_type application/json;
    return 200 '{"service":"ble-talkie","status":"reserved","relayReady":false,"maxTeamSize":4}';
}

location ^~ /ble-talkie/ {
    default_type application/json;
    return 503 '{"error":"relay_not_deployed","relayReady":false}';
}
